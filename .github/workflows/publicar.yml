# Renderiza o painel e publica no GitHub Pages a cada alteração na branch main
# (por exemplo, quando a coleta do dia é adicionada em data/seguidores.csv).
name: Publicar painel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  renderizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown
            any::dplyr
            any::tidyr
            any::plotly
            any::DT
            any::htmltools

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Renderizar
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: renderizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
